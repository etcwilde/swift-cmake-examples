name: Pull Request
on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

jobs:
  smoke_test:
    name: Smoke Test (CMake v${{ matrix.cmake.version }})
    runs-on: ubuntu-latest
    container: swift:6.1-bookworm
    strategy:
      matrix:
        cmake:
          - version: 3.22.6
            hash: 09e1b34026c406c5bf4d1b053eadb3a8519cb360e37547ebf4b70ab766d94fbc
          - version: 3.26.6
            hash: 2dd48ccd3e3d872ee4cc916f3f4e24812612421007e895f82bf9fc7e49831d62
          - version: 3.30.8
            hash: adc81f2944e6f86b44e86acea3abea1651ed7890206933484b8b74ac1280314f
          - version: 4.0.1
            hash: d66c11c010588c8256ee20a26b45977cd5b2f4aee2b742d4b8a353769940d147
    steps:
      - name: Clone Repo
        uses: actions/checkout@v4
      - name: Install Dependencies
        shell: bash
        run: apt update && apt install -y curl ninja-build
      - name: Setup CMake
        id: install-cmake
        uses: etcwilde/swift-github-workflows//.github/actions/install-cmake@ewilde/install-cmake-action
        with:
          cmake-version: ${{matrix.cmake.version}}
          hash: ${{ matrix.cmake.hash }}
      - name: Run Tests
        shell: bash
        env:
          CMAKE: ${{ steps.install-cmake.outputs.cmake }}
          CTEST: ${{ steps.install-cmake.outputs.ctest }}
        run: |
          "$CMAKE" -G Ninja -B test -S . -DCMAKE_BUILD_TYPE=Release
          "$CTEST" --output-on-failure --test-timeout 150 --test-dir test -j
